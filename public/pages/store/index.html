<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tienda · Pedify</title>
    <!--store-meta-->
    <meta name="theme-color" content="#17161c" />
    <link rel="icon" href="/assets/icons/logo.svg" type="image/svg+xml" />
    <link rel="preload" href="/assets/fonts/archivo-latin-wdth.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/css/app.css" />
    <script src="/js/error-report.js"></script>
    <script type="module" src="/js/store.js"></script>
  </head>
  <body class="bg-paper">
    <div id="store">
      <!-- Esqueleto mientras carga el menú -->
      <div class="mx-auto max-w-[64rem]" aria-busy="true" aria-label="Cargando la tienda">
        <div class="skeleton aspect-[16/9] rounded-none sm:aspect-[3/1] lg:rounded-b-[18px]"></div>
        <div class="grid gap-3 px-4 pt-5 sm:px-8">
          <div class="skeleton h-9 w-2/3"></div>
          <div class="skeleton h-5 w-5/6"></div>
          <div class="skeleton h-8 w-48 rounded-full"></div>
          <div class="mt-6 grid gap-4">
            <div class="skeleton h-24"></div>
            <div class="skeleton h-24"></div>
            <div class="skeleton h-24"></div>
          </div>
        </div>
      </div>
    </div>
    <noscript>
      <p class="p-6">Esta tienda necesita JavaScript para mostrar el menú. Actívalo en tu navegador.</p>
    </noscript>
  </body>
</html>
