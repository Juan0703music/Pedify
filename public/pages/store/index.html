<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tienda · Pedify</title>
    <!--store-meta-->
    <meta name="theme-color" content="#17161c" />
    <link rel="icon" href="/assets/icons/logo.svg" type="image/svg+xml" />
    <link rel="preload" href="/assets/fonts/archivo-latin-wdth.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/css/app.css" />
    <script src="/js/error-report.js"></script>
    <script type="module" src="/js/store.js"></script>
  </head>
  <body class="store-night">
    <div id="store">
      <!-- Esqueleto mientras carga el menú -->
      <div aria-busy="true" aria-label="Cargando la tienda">
        <div class="skeleton h-[min(84svh,46rem)] rounded-none"></div>
        <div class="mx-auto grid max-w-[72rem] gap-3 px-4 pt-5 sm:px-8">
          <div class="flex gap-2">
            <div class="skeleton h-11 w-40 rounded-full"></div>
            <div class="skeleton h-11 w-32 rounded-full"></div>
          </div>
          <div class="mt-8 grid gap-4">
            <div class="skeleton h-28 rounded-[20px]"></div>
            <div class="skeleton h-28 rounded-[20px]"></div>
          </div>
        </div>
      </div>
    </div>
    <noscript>
      <p class="p-6">Esta tienda necesita JavaScript para mostrar el menú. Actívalo en tu navegador.</p>
    </noscript>
  </body>
</html>
